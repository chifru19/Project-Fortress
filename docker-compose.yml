version: '3.8'

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
    internal: true  # Completely isolates this network from external WAN routing

services:
  frontend-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - public-net

  fortress-honeypot:
    image: cowrie/cowrie:latest
    ports:
      - "2222:2222"
    networks:
      - public-net

  secure-database:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
    networks:
      - private-net

  security-monitor:
    image: alpine
    volumes:
      - .:/app
    working_dir: /app
    command: ["/bin/sh", "/app/monitor.sh"]
    networks:
      - public-net
      - private-net
