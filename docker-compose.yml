networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
    internal: true

services:
  web-browser:
    image: alpine
    command: sleep infinity
    networks:
      - public-net

  frontend-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - public-net
      - private-net

  fortress-honeypot:
    image: cowrie/cowrie:latest
    ports:
      - "2222:2222"
    networks:
      - public-net

  secure-database:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
    networks:
      - private-net

  security-monitor:
    image: alpine
    volumes:
      - .:/app
    working_dir: /app
    command: ["/bin/sh", "/app/monitor.sh"]
    networks:
      - public-net
      - private-net
